<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        fill: #174D32;
        font-size: 52px;
        letter-spacing: -0.5px;
      }
      .brand-tagline {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        fill: #B58A16;
        font-size: 15px;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Logo Mark (Left) -->
  <g transform="translate(15, 10)">
    <!-- Outer Q Ring (Dark Green) -->
    <!-- Arc for Q body with opening at bottom right (around 45-60 deg) for leaf -->
    <path d="M 70 12 
             A 58 58 0 1 1 114 106
             A 42 42 0 1 0 70 28
             A 42 42 0 0 0 28 70
             A 42 42 0 0 0 70 112
             C 76 112 82 110 88 107
             L 94 122
             C 86 126 78 128 70 128
             A 58 58 0 0 1 12 70
             A 58 58 0 0 1 70 12 Z" 
          fill="#174D32" />

    <!-- Inner 'T' (Mustard Yellow) -->
    <!-- Crossbar -->
    <path d="M 46 45 
             C 46 41 49 38 53 38 
             L 87 38 
             C 91 38 94 41 94 45 
             L 94 53 
             C 94 55 92 57 90 57 
             L 76 57 
             L 76 98 
             C 76 102 73 105 69 105 
             L 65 105 
             L 64 57 
             L 50 57 
             C 48 57 46 55 46 53 Z" 
          fill="#B58A16" />

    <!-- Leaf Tail of Q (Dark Green / Accent Leaf) -->
    <!-- Sprouting from bottom right of the Q circle -->
    <path d="M 98 94 
             C 114 90 134 98 140 122 
             C 126 128 106 124 94 108 
             C 92 104 94 97 98 94 Z" 
          fill="#174D32" />
    <!-- Leaf Center Vein -->
    <path d="M 98 96 
             C 108 104 122 112 138 120" 
          stroke="#EBF5F0" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none" />
  </g>

  <!-- Typography (Right) -->
  <text x="165" y="85" class="brand-title">Trash Qwins</text>
  <text x="168" y="116" class="brand-tagline">TURNING WASTE INTO WEALTH</text>
</svg>

