<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="qGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5336"/>
      <stop offset="100%" stop-color="#13432A"/>
    </linearGradient>
    <linearGradient id="tGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6A125"/>
      <stop offset="100%" stop-color="#B38412"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Outer Green Q-Ring (Center: 90, 85, R_out: 66, R_in: 48) -->
    <!-- Leaves gap at bottom right (around 35-70 degrees) for Q-tail -->
    <path d="M 138 48
             A 66 66 0 1 0 118 148
             L 110 134
             A 48 48 0 1 1 125 57
             Z"
          fill="url(#qGreenGrad)"/>

    <!-- Inner Mustard-Yellow 'T' -->
    <!-- Crossbar -->
    <rect x="52" y="52" width="76" height="15" rx="4" fill="url(#tGoldGrad)"/>
    <!-- Stem -->
    <rect x="82" y="65" width="16" height="60" rx="3" fill="url(#tGoldGrad)"/>

    <!-- Leaf tail of 'Q' extending outwards to bottom-right -->
    <path d="M 98 120
             C 114 110 144 112 162 146
             C 142 156 116 148 102 130
             Z"
          fill="url(#qGreenGrad)"/>
    <!-- Leaf Center Vein -->
    <path d="M 104 123
             C 120 130 140 138 156 144"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-opacity="0.9"
          fill="none"/>

    <!-- Leaf Sprout on T Stem -->
    <path d="M 98 94
             C 112 84 130 90 134 106
             C 120 110 106 104 98 96
             Z"
          fill="url(#qGreenGrad)"/>
    <path d="M 100 95
             C 110 98 122 102 128 104"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-opacity="0.8"
          fill="none"/>
  </g>
</svg>