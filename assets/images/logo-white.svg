<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <defs>
    <style>
      .h-title {
        font-family: 'Outfit', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #174D32;
        letter-spacing: -0.5px;
      }
      .h-tagline {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #B58A16;
        letter-spacing: 2.2px;
      }
    </style>
    <linearGradient id="hGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5336"/>
      <stop offset="100%" stop-color="#13432A"/>
    </linearGradient>
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6A125"/>
      <stop offset="100%" stop-color="#B38412"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Mark -->
  <g transform="translate(-15, -15) scale(0.85)">
    <!-- Outer Green Q-Ring -->
    <path d="M 138 48
             A 66 66 0 1 0 118 148
             L 110 134
             A 48 48 0 1 1 125 57
             Z"
          fill="url(#hGreenGrad)"/>

    <!-- Inner Mustard-Yellow 'T' -->
    <rect x="52" y="52" width="76" height="15" rx="4" fill="url(#hGoldGrad)"/>
    <rect x="82" y="65" width="16" height="60" rx="3" fill="url(#hGoldGrad)"/>

    <!-- Leaf tail of 'Q' -->
    <path d="M 98 120
             C 114 110 144 112 162 146
             C 142 156 116 148 102 130
             Z"
          fill="url(#hGreenGrad)"/>
    <path d="M 104 123
             C 120 130 140 138 156 144"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-opacity="0.9"
          fill="none"/>

    <!-- Leaf on T Stem -->
    <path d="M 98 94
             C 112 84 130 90 134 106
             C 120 110 106 104 98 96
             Z"
          fill="url(#hGreenGrad)"/>
    <path d="M 100 95
             C 110 98 122 102 128 104"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-opacity="0.8"
          fill="none"/>
  </g>

  <!-- Typography Right -->
  <text x="145" y="74" class="h-title">Trash Qwins</text>
  <text x="147" y="102" class="h-tagline">TURNING WASTE INTO WEALTH</text>
</svg>